  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-slate-200">
    <div id="root"></div>
    <script>
      // Gracefully suppress benign Vite dev-server HMR WebSocket proxy disconnect notices in AI Studio preview
      window.addEventListener('error', function (event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) {
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason).includes('@vite/client'))) {
          event.stopImmediatePropagation();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
